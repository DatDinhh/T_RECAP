   <g id="text_16">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8c1d40" x="143.341714" y="285.8652" transform="rotate(-0 143.341714 285.8652)">FFT: 28-bit complex data, 17-bit twiddles, divide by two at each stage</text>
   </g>
   <g id="text_17">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #246b77" x="143.341714" y="331.452" transform="rotate(-0 143.341714 331.452)">IFFT: 36-bit complex data, 17-bit twiddles, no per-stage divide</text>
   </g>
   <g id="text_18">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8c1d40" x="143.341714" y="398.7468" transform="rotate(-0 143.341714 398.7468)">Transform frame service</text>
   </g>
   <g id="text_19">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8c1d40" x="143.341714" y="448.6752" transform="rotate(-0 143.341714 448.6752)">256 load clocks + 7168 compute clocks + 512 output clocks = 7936 clocks</text>
   </g>
   <g id="text_20">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #777a80" x="143.341714" y="509.4576" transform="rotate(-0 143.341714 509.4576)">One complex output every two clocks. Input gaps and output stalls extend service.</text>
