<rect x="65" y="800" width="460" height="196" rx="13" fill="#F7ECD5" stroke="none" stroke-width="1.3"/>
<text x="84" y="829" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#9C7D3F" text-anchor="start">AT-MOST-ONCE COMMAND EFFECT</text>
<text x="84" y="855" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#26364B" text-anchor="start">Identical retries resend cached result bytes. Stale or</text>
<text x="84" y="877" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#26364B" text-anchor="start">conflicting sequence numbers are rejected. Applied</text>
<text x="84" y="899" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#26364B" text-anchor="start">results require command-specific writes and</text>
<text x="84" y="921" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#26364B" text-anchor="start">readbacks. PING remains a diagnostic exception.</text>
<rect x="555" y="800" width="490" height="196" rx="13" fill="#DFECFA" stroke="none" stroke-width="1.3"/>
<text x="574" y="829" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#4D78A8" text-anchor="start">CODEC OWNERSHIP GRANT</text>
<text x="574" y="855" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#26364B" text-anchor="start">Linux driver holds HPS_GPIO48 low and confirms</text>
<text x="574" y="877" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#26364B" text-anchor="start">readback, selecting the FPGA I2C path. HPS then sets</text>
<text x="574" y="899" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#26364B" text-anchor="start">PLATFORM_CONTROL[0] at 0x184. The FPGA reads this</text>
<text x="574" y="921" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#26364B" text-anchor="start">grant, not the dedicated GPIO48 pin.</text>
<rect x="1075" y="800" width="460" height="196" rx="13" fill="#EBE4FA" stroke="none" stroke-width="1.3"/>
<text x="1094" y="829" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#8066A9" text-anchor="start">CONFIGURATION CONSISTENCY</text>
<text x="1094" y="855" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#26364B" text-anchor="start">A shared runtime profile binds FPGA parameters to</text>
<text x="1094" y="877" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#26364B" text-anchor="start">HPS startup. Telemetry cadence is synthesized. All</text>
<text x="1094" y="899" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#26364B" text-anchor="start">profiles reset to BRAM; HPS commits ADC or audio</text>
<text x="1094" y="921" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#26364B" text-anchor="start">selection after startup.</text>
