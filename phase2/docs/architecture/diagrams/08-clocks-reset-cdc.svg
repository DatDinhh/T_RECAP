<text x="574" y="898" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#26364B" text-anchor="start">synchronization stages. Pointer route &lt;= 20 ns; Gray</text>
<text x="574" y="920" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#26364B" text-anchor="start">skew &lt;= 10 ns; payload route &lt;= 20 ns. FIFO</text>
<text x="574" y="942" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#26364B" text-anchor="start">ownership transfers payload.</text>
