name: quartus-smoke

"on":
  workflow_dispatch:
    inputs:
      run_real_quartus:
        description: "Run the real Quartus smoke build on a self-hosted runner labeled quartus."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      quartus_project:
        description: "Quartus project base, .qpf, or .qsf path for the real self-hosted job."
        required: false
        default: "platform/de1soc/quartus/trecap_de1soc"
        type: string
      quartus_profile:
        description: "Validated build profile. Default remains fail-closed BRAM replay; select the ADC profile explicitly."
        required: false
        default: "config/profiles/de1soc_bram_replay.json"
        type: string
  pull_request:
    paths:
      - "Makefile"
      - "rtl/**"
      - "constraints/de1soc/**"
      - "platform/de1soc/**"
      - "filelists/**"
      - "scripts/quartus/**"
      - "scripts/gen_headers.py"
      - "scripts/gen_filelists.py"
      - "scripts/check_generated.py"
      - "scripts/check_profiles.py"
      - "scripts/address_map_contract.py"
      - "scripts/check_address_map.py"
      - "scripts/check_csr_adapter.py"
      - "scripts/check_platform_designer_wrapper.py"
      - "scripts/check_source_core_integration.py"
      - "scripts/check_core_telemetry_composition.py"
      - "scripts/check_de1soc_board_top.py"
      - "scripts/check_de1soc_clock_reset.py"
      - "scripts/check_de1soc_audio_path.py"
      - "scripts/sim/check_step16_audio_model.py"
      - "scripts/check_de1soc_adc_path.py"
      - "scripts/sim/check_step17_adc_model.py"
      - "scripts/freeze_address_map.py"
      - "scripts/write_platform_generation_manifest.py"
      - "sw/hps/config/trecap_hps_config.json"
      - "spec/generated/**"
      - "spec/schemas/avalon_csr_adapter.schema.json"
      - "spec/schemas/platform_designer_wrapper.schema.json"
      - "spec/schemas/source_core_integration.schema.json"
      - "spec/schemas/core_telemetry_composition.schema.json"
      - "spec/schemas/de1soc_board_top_integration.schema.json"
      - "spec/schemas/de1soc_clock_reset_architecture.schema.json"
      - "spec/schemas/de1soc_audio_linein.schema.json"
      - "spec/schemas/de1soc_adc_live.schema.json"
      - "spec/schemas/runtime_profile.schema.json"
      - "config/profiles/**"
      - "config/boards/de1soc_source_core_integration.json"
      - "config/boards/core_telemetry_composition.json"
      - "config/boards/de1soc_board_top_integration.json"
      - "config/boards/de1soc_clock_reset_architecture.json"
      - "config/boards/de1soc_audio_linein.json"
      - "config/profiles/de1soc_linein_demo.json"
      - "config/boards/de1soc_adc_live.json"
      - "config/profiles/de1soc_adc_demo.json"
      - "ci/github/quartus_smoke.yml"
  push:
    branches: [main]
    paths:
      - "Makefile"
      - "rtl/**"
      - "constraints/de1soc/**"
      - "platform/de1soc/**"
      - "filelists/**"
      - "scripts/quartus/**"
      - "scripts/gen_headers.py"
      - "scripts/gen_filelists.py"
      - "scripts/check_generated.py"
      - "scripts/check_profiles.py"
      - "scripts/address_map_contract.py"
      - "scripts/check_address_map.py"
      - "scripts/check_csr_adapter.py"
      - "scripts/check_platform_designer_wrapper.py"
      - "scripts/check_source_core_integration.py"
      - "scripts/check_core_telemetry_composition.py"
      - "scripts/check_de1soc_board_top.py"
      - "scripts/check_de1soc_clock_reset.py"
      - "scripts/check_de1soc_audio_path.py"
      - "scripts/sim/check_step16_audio_model.py"
      - "scripts/check_de1soc_adc_path.py"
      - "scripts/sim/check_step17_adc_model.py"
      - "scripts/freeze_address_map.py"
      - "scripts/write_platform_generation_manifest.py"
      - "sw/hps/config/trecap_hps_config.json"
      - "spec/generated/**"
      - "spec/schemas/avalon_csr_adapter.schema.json"
      - "spec/schemas/platform_designer_wrapper.schema.json"
      - "spec/schemas/source_core_integration.schema.json"
      - "spec/schemas/core_telemetry_composition.schema.json"
      - "spec/schemas/de1soc_board_top_integration.schema.json"
      - "spec/schemas/de1soc_clock_reset_architecture.schema.json"
      - "spec/schemas/de1soc_audio_linein.schema.json"
      - "spec/schemas/de1soc_adc_live.schema.json"
      - "spec/schemas/runtime_profile.schema.json"
      - "config/profiles/**"
      - "config/boards/de1soc_source_core_integration.json"
      - "config/boards/core_telemetry_composition.json"
      - "config/boards/de1soc_board_top_integration.json"
      - "config/boards/de1soc_clock_reset_architecture.json"
      - "config/boards/de1soc_audio_linein.json"
      - "config/profiles/de1soc_linein_demo.json"
      - "config/boards/de1soc_adc_live.json"
      - "config/profiles/de1soc_adc_demo.json"
      - "ci/github/quartus_smoke.yml"

permissions:
  contents: read

concurrency:
  group: quartus-smoke-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  dry-run:
    name: Quartus flow dry-run on hosted Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            sw/reference_model/requirements.lock
            sw/pc_dashboard/pyproject.toml

      - name: Install dry-run dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            make \
            tcl
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install jsonschema

      - name: Check generated contracts and filelists
        run: |
          python scripts/gen_headers.py
          python scripts/gen_filelists.py
          python scripts/check_generated.py --quiet
          python scripts/check_address_map.py --quiet
          python scripts/check_csr_adapter.py --quiet
          python scripts/check_platform_designer_wrapper.py --quiet
          python scripts/check_source_core_integration.py --quiet
          python scripts/check_core_telemetry_composition.py --quiet
          python scripts/check_de1soc_board_top.py --quiet
          python scripts/check_de1soc_clock_reset.py --quiet
          python scripts/check_de1soc_audio_path.py --quiet
          python scripts/sim/check_step16_audio_model.py
          python scripts/check_de1soc_adc_path.py --quiet
          python scripts/sim/check_step17_adc_model.py

      - name: Validate Platform Designer Tcl flow without Quartus
        run: |
          platform/de1soc/qsys/generate_system.sh \
            --mode validate \
            --skip-contract-checks \
            --print-summary
          platform/de1soc/qsys/generate_system.sh \
            --mode construct \
            --dry-run \
            --skip-contract-checks \
            --print-summary
          platform/de1soc/qsys/generate_system.sh \
            --mode generate \
            --dry-run \
            --skip-contract-checks \
            --print-summary

      - name: Dry-run full DE1-SoC Quartus wrapper
        run: |
          scripts/quartus/build_de1soc.sh \
            --dry-run \
            --skip-contract-checks \
            --allow-missing-constraints

      - name: Dry-run explicit Step-17 ADC profile
        run: make quartus-de1soc-adc-dry-run

  real-quartus:
    name: Real Quartus smoke build on self-hosted runner
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_real_quartus == 'true'
    runs-on: [self-hosted, linux, quartus]
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      MAKE_JOBS: "4"
      QUARTUS_PROJECT: ${{ github.event.inputs.quartus_project }}
      QUARTUS_PROFILE: ${{ github.event.inputs.quartus_profile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Quartus and Platform Designer tools
        run: |
          command -v quartus_sh
          quartus_sh --version
          command -v qsys-script
          command -v qsys-generate

      - name: Check generated contracts
        run: |
          python3 scripts/check_generated.py --quiet
          python3 scripts/check_address_map.py --quiet
          python3 scripts/check_csr_adapter.py --quiet
          python3 scripts/check_platform_designer_wrapper.py --quiet
          python3 scripts/check_source_core_integration.py --quiet
          python3 scripts/check_core_telemetry_composition.py --quiet
          python3 scripts/check_de1soc_board_top.py --quiet
          python3 scripts/check_de1soc_clock_reset.py --quiet
          python3 scripts/check_de1soc_audio_path.py --quiet
          python3 scripts/sim/check_step16_audio_model.py
          # The build wrapper below runs the Step-17 ADC checker/model only
          # when the validated selected profile has input.kind=adc_live.

      - name: Construct and generate Platform Designer system
        run: |
          platform/de1soc/qsys/generate_system.sh \
            --mode construct \
            --run-dir "runs/platform/de1soc/qsys/github-${GITHUB_RUN_ID}-construct" \
            --print-summary
          platform/de1soc/qsys/generate_system.sh \
            --mode generate \
            --run-dir "runs/platform/de1soc/qsys/github-${GITHUB_RUN_ID}-generate" \
            --print-summary

      - name: Run real Quartus build wrapper
        run: |
          scripts/quartus/build_de1soc.sh \
            --project "${QUARTUS_PROJECT}" \
            --profile "${QUARTUS_PROFILE}" \
            --run-dir "runs/quartus/de1soc/github-${GITHUB_RUN_ID}" \
            --jobs "${MAKE_JOBS}" \
            --skip-platform-generate

      - name: Confirm generated address-map evidence
        run: python3 scripts/check_address_map.py --require-sopcinfo --quiet

      - name: Confirm generated Platform Designer ABI
        run: python3 scripts/check_platform_designer_wrapper.py --require-generated --quiet

      - name: Upload Quartus smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trecap-quartus-smoke-${{ github.run_id }}
          path: |
            runs/quartus/de1soc/github-${{ github.run_id }}/**
            runs/platform/de1soc/qsys/github-${{ github.run_id }}-construct/**
            runs/platform/de1soc/qsys/github-${{ github.run_id }}-generate/**
          if-no-files-found: ignore
          retention-days: 14
