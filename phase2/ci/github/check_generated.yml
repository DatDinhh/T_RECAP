permissions:
  contents: read

concurrency:
  group: check-generated-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  generated-contracts:
    name: generated headers and filelists are deterministic
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            sw/reference_model/requirements.lock
            sw/pc_dashboard/pyproject.toml

      - name: Install generated-contract dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install jsonschema

      - name: Regenerate headers
        run: python scripts/gen_headers.py

      - name: Regenerate RTL filelists
        run: python scripts/gen_filelists.py

      - name: Run generated drift checker
        run: python scripts/check_generated.py --quiet

      - name: Validate source-frozen address map
        run: python scripts/check_address_map.py --quiet

      - name: Validate Avalon-MM CSR adapter source contract
        run: python scripts/check_csr_adapter.py --quiet

      - name: Validate Platform Designer wrapper source contract
        run: python scripts/check_platform_designer_wrapper.py --quiet

      - name: Validate source-to-core integration source contract
        run: python scripts/check_source_core_integration.py --quiet

      - name: Validate core plus telemetry composition source contract
        run: python scripts/check_core_telemetry_composition.py --quiet

      - name: Validate DE1-SoC board-top source-integration contract
        run: python scripts/check_de1soc_board_top.py --quiet

      - name: Validate DE1-SoC clock/reset source architecture
        run: python scripts/check_de1soc_clock_reset.py --quiet

      - name: Validate Step-16 DE1-SoC audio source contract
        run: python scripts/check_de1soc_audio_path.py --quiet

      - name: Run Step-16 dependency-free audio architecture model
        run: python scripts/sim/check_step16_audio_model.py

      - name: Validate Step-17 DE1-SoC ADC source contract
        run: python scripts/check_de1soc_adc_path.py --quiet

      - name: Run Step-17 dependency-free ADC protocol/CDC model
        run: python scripts/sim/check_step17_adc_model.py

      - name: Verify working tree is clean for generated files
        run: |
          git diff --exit-code -- \
            spec/generated/gen_manifest.json \
            rtl/include/generated \
            sw/hps/include/generated \
            sw/pc_dashboard/generated \
            sw/reference_model/generated \
            filelists

      - name: Upload generated manifest and filelists
        uses: actions/upload-artifact@v4
        with:
          name: trecap-generated-contracts
          path: |
            spec/generated/gen_manifest.json
            filelists/*.f
            filelists/*.inc
          if-no-files-found: error
          retention-days: 14
