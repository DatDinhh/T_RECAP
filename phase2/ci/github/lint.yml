name: lint

"on":
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  repo-hygiene:
    name: repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            sw/reference_model/requirements.lock
            sw/pc_dashboard/pyproject.toml

      - name: Install minimal lint dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install jsonschema

      - name: Check repository layout
        run: make check-layout

      - name: Run basic lint gate
        run: make lint-basic

      - name: Run explicit Step-16 audio source/model gates
        run: make check-de1soc-audio-path check-step16-audio-model

      - name: Run explicit Step-17 ADC source/model gates
        run: make check-de1soc-adc-path check-step17-adc-model

      - name: Check formatting script in dry-run mode
        run: scripts/format.sh --check --dry-run

      - name: Check generated contracts are not stale
        run: python scripts/check_generated.py --quiet

  hps-dashboard-smoke:
    name: HPS and PC dashboard smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      MAKE_JOBS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            sw/pc_dashboard/pyproject.toml
            sw/reference_model/requirements.lock

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install jsonschema

      - name: Build HPS UDP streamer
        run: make -C sw/hps build

      - name: HPS streamer dry-run config load
        run: |
          ./build/hps/bin/trecap_udp_streamer \
            --config sw/hps/config/trecap_hps_config.json \
            --dry-run \
            --quiet

      - name: Import PC dashboard modules
        run: make dashboard-import

      - name: Run dependency-free Step-15 dashboard regression
        run: make dashboard-step15-test

      - name: Optional matplotlib Agg dashboard smoke
        env:
          MPLBACKEND: Agg
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          if python -c 'import matplotlib' >/dev/null 2>&1; then
            trecap_mplconfig="$(mktemp -d)"
            trap 'rm -rf -- "${trecap_mplconfig}"' EXIT
            export MPLCONFIGDIR="${trecap_mplconfig}"
            PYTHONPATH="sw/pc_dashboard:sw/pc_dashboard/generated" python - <<'PY'
          from trecap_dashboard.plots import DashboardPlotter
          from trecap_dashboard.ring_buffers import DashboardRingBuffers

          plotter = DashboardPlotter()
          plotter.update(DashboardRingBuffers().snapshot())
          assert plotter.figure is not None
          plotter.close()
          print("dashboard matplotlib Agg smoke: OK")
          PY
          else
            echo "dashboard matplotlib Agg smoke: SKIP (matplotlib not installed)"
          fi

      - name: PC dashboard preflight
        run: |
          python sw/pc_dashboard/scripts/run_dashboard.py \
            --preflight-only \
            --text-only \
            --quiet
