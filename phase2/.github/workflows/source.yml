name: Source and host build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check source hygiene
        run: python scripts/repo_hygiene.py
      - name: Install production RTL frontend
        run: python -m pip install -r scripts/requirements-source.txt
      - name: Elaborate production RTL sources
        run: python scripts/elaborate_rtl_sources.py
      - name: Configure reference library and tool
        run: cmake --preset host
      - name: Compile reference library and tool
        run: cmake --build --preset host --parallel 2
      - name: Configure HPS transport on Linux
        if: runner.os == 'Linux'
        run: cmake --preset hps
      - name: Compile HPS transport on Linux
        if: runner.os == 'Linux'
        run: cmake --build --preset hps --parallel 2
