name: Phase 2 source and host build
on:
  push:
    paths: ['phase2/**', '.github/workflows/phase2-source.yml']
  pull_request:
    paths: ['phase2/**', '.github/workflows/phase2-source.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: phase2
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check publication hygiene regressions
        run: python tests/verification/test_repo_hygiene.py
      - name: Check source hygiene
        run: python scripts/repo_hygiene.py
      - name: Install production RTL frontend
        run: python -m pip install -r scripts/requirements-source.txt
      - name: Elaborate production RTL sources
        run: python scripts/elaborate_rtl_sources.py
      - name: Configure reference library and functional tests
        run: cmake --preset verify
      - name: Compile reference library and functional tests
        run: cmake --build --preset verify --parallel 2
      - name: Run reference functional tests
        run: ctest --preset verify
      - name: Check portable DV package and qualify its scoreboards
        run: python verification/tsh2/run.py --check-package
      - name: Check UVM source package integrity
        run: python verification/uvm/run.py --check-package
      - name: Check formal package and recorded execution integrity
        run: python verification/formal/run.py --repo-root . --check-package
      - name: Check UVM and formal report integrity
        run: python docs/verification/uvm_formal/check_bundle.py
      - name: Check published evidence integrity
        run: python docs/results/verification_20261017/export_public_evidence.py --check docs/results/verification_20261017
      - name: Check overview figures and result integrity
        run: python docs/project_overview/check_bundle.py
      - name: Check current TSH2 architecture atlas integrity
        run: python docs/architecture/tsh2/build_atlas.py --repo-root . --output docs/architecture/tsh2 --check
      - name: Configure HPS transport on Linux
        if: runner.os == 'Linux'
        run: cmake --preset hps
      - name: Compile HPS transport on Linux
        if: runner.os == 'Linux'
        run: cmake --build --preset hps --parallel 2
